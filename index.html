<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PréventIA Réseau</title>
<meta name="description" content="Laboratoire collaboratif d'innovation IA des Services de Prévention et de Santé au Travail.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 8Q33.5 7.5 37.9 16Q43 24 37.9 32Q33.5 40.5 24 40Q14.5 40.5 10.1 32Q5 24 10.1 16Q14.5 7.5 24 8Z' fill='none' stroke='%2328a3a0' stroke-width='2.4'/%3E%3Cg fill='%231f3a68'%3E%3Ccircle cx='24' cy='8' r='4'/%3E%3Ccircle cx='37.9' cy='32' r='4'/%3E%3Ccircle cx='10.1' cy='32' r='4'/%3E%3C/g%3E%3Cg fill='%2328a3a0'%3E%3Ccircle cx='37.9' cy='16' r='4'/%3E%3Ccircle cx='24' cy='40' r='4'/%3E%3Ccircle cx='10.1' cy='16' r='4'/%3E%3C/g%3E%3Ccircle cx='24' cy='24' r='6' fill='%23f0913a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ================= Design tokens ================= */
:root{
  --navy: oklch(0.32 0.08 255);
  --navy-2: oklch(0.42 0.1 255);
  --navy-soft: oklch(0.95 0.02 255);
  --teal: oklch(0.63 0.1 190);
  --teal-ink: oklch(0.45 0.08 195);
  --teal-soft: oklch(0.95 0.03 190);
  --orange: oklch(0.72 0.15 55);
  --orange-ink: oklch(0.52 0.14 50);
  --orange-soft: oklch(0.96 0.04 65);
  --green: oklch(0.58 0.13 150);
  --green-soft: oklch(0.95 0.04 150);
  --red: oklch(0.56 0.18 25);
  --red-soft: oklch(0.96 0.03 25);
  --ink: oklch(0.27 0.02 255);
  --muted: oklch(0.5 0.02 255);
  --line: oklch(0.91 0.01 255);
  --bg: oklch(0.985 0.004 90);
  --card: #fff;
  --radius: 16px;
  --shadow: 0 1px 2px oklch(0.3 0.03 255 / .06), 0 8px 24px oklch(0.3 0.03 255 / .06);
  --font: "DM Sans", system-ui, sans-serif;
  --serif: "DM Serif Display", Georgia, serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--navy-2)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;color:var(--navy)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,3vw,2rem)}
h3{font-size:1.08rem;font-weight:700}
p{margin:0 0 1em}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px;top:8px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* ================= Top bar ================= */
.topbar{position:sticky;top:0;z-index:40;background:oklch(0.985 0.004 90 / .92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:700;font-size:1.08rem;white-space:nowrap}
.brand b{color:var(--teal-ink);font-weight:700}
#nav{display:flex;gap:2px;flex:1}
#nav a{white-space:nowrap;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:10px;font-weight:500;font-size:.94rem}
#nav a:hover{background:var(--navy-soft)}
#nav a[aria-current=page]{background:var(--navy-soft);color:var(--navy)}
.bar-right{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-ink);font-weight:700;font-size:.85rem;text-decoration:none;flex:none}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:42px;height:40px;font-size:1.2rem;cursor:pointer;color:var(--navy)}
.demo-banner{background:var(--orange-soft);color:var(--orange-ink);text-align:center;font-size:.88rem;padding:6px 12px;font-weight:500}
.demo-banner button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
@media (max-width:1180px){
  .burger{display:block}
  #nav{display:none;position:absolute;top:66px;left:0;right:0;background:var(--card);flex-direction:column;padding:10px 16px 16px;border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  #nav.open{display:flex}
  #nav a{padding:12px}
  .bar-right .btn-label{display:none}
}

/* ================= Buttons & forms ================= */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:11px 18px;font:600 .95rem var(--font);cursor:pointer;text-decoration:none;transition:transform .15s, box-shadow .15s, background .15s;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-accent{background:var(--orange);color:oklch(0.22 0.04 50)}
.btn-accent:hover{box-shadow:0 6px 18px oklch(0.72 0.15 55 / .35)}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--navy)}
.btn-ghost:hover{border-color:var(--teal)}
.btn-soft{background:var(--teal-soft);color:var(--teal-ink)}
.btn-danger{background:var(--card);border-color:oklch(0.85 0.06 25);color:var(--red)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
label{font-weight:600;font-size:.92rem;display:block;margin-bottom:6px;color:var(--navy)}
.hint{font-weight:400;color:var(--muted);font-size:.85rem;display:block;margin-top:2px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:44px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px oklch(0.63 0.1 190 / .15)}
.field{margin-bottom:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.logrow{grid-template-columns:200px 1fr}
@media(max-width:640px){.row2,.logrow{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-radio{position:relative}
.chip-radio input{position:absolute;opacity:0}
.chip-radio span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-weight:500;font-size:.92rem}
.chip-radio input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip-radio input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}
.choice{display:grid;gap:10px}
.choice.c3{grid-template-columns:repeat(3,1fr)}
@media(max-width:700px){.choice.c3{grid-template-columns:1fr}}
.choice label{font-weight:400;margin:0;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--card);color:var(--ink)}
.choice label:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.choice input{margin-top:4px;accent-color:var(--teal)}
.choice b{display:block;color:var(--navy)}
.stop{display:none;background:var(--red-soft);border:1px solid oklch(0.85 0.06 25);color:oklch(0.42 0.14 25);padding:12px 14px;border-radius:12px;margin-top:10px}
.stop.show{display:block}

/* ================= Cards / badges ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--navy-soft);color:var(--navy);white-space:nowrap}
.b-teal{background:var(--teal-soft);color:var(--teal-ink)}
.b-orange{background:var(--orange-soft);color:var(--orange-ink)}
.b-green{background:var(--green-soft);color:oklch(0.42 0.11 150)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-gray{background:oklch(0.95 0.005 255);color:var(--muted)}
.b-line{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.item{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;transition:border-color .15s, transform .15s}
.item:hover{border-color:var(--teal);transform:translateY(-2px)}
.item h3{margin:0}
.item p{margin:0;color:var(--muted);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .more{margin-top:auto;padding-top:8px;font-weight:600;color:var(--teal-ink);font-size:.9rem}
.meta{font-size:.84rem;color:var(--muted)}

/* ================= Page structure ================= */
main{min-height:70vh}
.page{padding:36px 0 64px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head p{margin:0;color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--teal-ink);margin-bottom:10px;display:block}
section.band{padding:64px 0}
.layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.toolbar>*{flex:1 1 160px;max-width:260px}
.toolbar input[type=search]{max-width:none;flex:2 1 220px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs a{padding:10px 16px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current=page]{color:var(--navy);border-color:var(--orange)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{margin-bottom:10px}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.dots::after{content:'…';animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

/* ================= Hero ================= */
/* Hero : image de fond animée + réseau de particules */
.hero{position:relative;overflow:hidden;min-height:640px;display:flex;align-items:center;padding:72px 0;isolation:isolate}
.hero-bg{position:absolute;inset:-8%;z-index:-3;transform:translate(var(--px,0),var(--py,0));transition:transform .6s ease-out}
.hero-bg-img{position:absolute;inset:0;background:var(--bg) center/cover no-repeat;animation:heroDrift 30s ease-in-out infinite alternate}
@keyframes heroDrift{0%{transform:scale(1.04) translate(0,0)}50%{transform:scale(1.12) translate(-2.5%,1.5%)}100%{transform:scale(1.08) translate(2%,-1.5%)}}
.hero-fx{position:absolute;inset:0;z-index:-2;width:100%;height:100%;pointer-events:none}
.hero-veil{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 46% 62% at 50% 50%,oklch(0.985 0.004 90 / .93) 0%,oklch(0.985 0.004 90 / .78) 50%,oklch(0.985 0.004 90 / 0) 100%),linear-gradient(0deg,var(--bg) 0%,transparent 20%)}
.hero>.wrap{width:100%}
.hero-text{max-width:760px;margin:0 auto;text-align:center}
.hero-text .lead{margin-left:auto;margin-right:auto;max-width:620px}
.hero-text .cta,.hero-text .trust{justify-content:center}
.hero .lead{color:oklch(0.4 0.02 255)}
@media(max-width:900px){.hero{min-height:560px;padding:56px 0}.hero-veil{background:linear-gradient(180deg,oklch(0.985 0.004 90 / .55) 0%,oklch(0.985 0.004 90 / .88) 45%,var(--bg) 100%)}}
@media (prefers-reduced-motion:reduce){.hero-bg{transition:none}}
.hero h1 em{font-style:normal;color:var(--teal-ink)}
.lead{font-size:1.15rem;color:var(--muted);max-width:560px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;font-size:.88rem;color:var(--muted)}
.trust span{display:flex;align-items:center;gap:6px}

/* Constellation */
.const .ln{stroke:var(--teal);stroke-width:1.4;opacity:.45}
.const .ln.thin{opacity:.22}
.const .x{stroke:var(--navy-2);stroke-width:1;opacity:.25;stroke-dasharray:3 6}
.const .flow{fill:none;stroke:var(--orange);stroke-width:2;stroke-dasharray:4 9;opacity:.8;animation:flow 7s linear infinite}
.const .nd{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
.const .nd-n{fill:var(--navy)}
.const .nd-t{fill:var(--teal)}
.const .nd-c{fill:#fff;stroke:var(--navy);stroke-width:3}
.const .halo{fill:var(--orange);opacity:.14;transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}
.const .core{fill:var(--orange)}
.const .lbl{font:600 13px var(--font);fill:var(--navy)}
.const .lbl-bg{fill:#fff;stroke:var(--line)}
@keyframes flow{to{stroke-dashoffset:-130}}
@keyframes pulse{50%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Pillars, cycle, traffic light */
.pillar{position:relative}
.pillar .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px}
.cycle{list-style:none;padding:0;margin:0;display:flex;gap:6px;counter-reset:c}
.cycle li{flex:1;position:relative;text-align:center;font-size:.82rem;font-weight:600;color:var(--muted);padding-top:38px}
.cycle li span{position:absolute;top:0;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:oklch(0.94 0.005 255);color:var(--muted);font-size:.8rem;z-index:1}
.cycle li::before{content:"";position:absolute;top:14px;left:-50%;right:50%;height:3px;background:oklch(0.93 0.005 255)}
.cycle li:first-child::before{display:none}
.cycle li.done span{background:var(--teal);color:#fff}
.cycle li.done::before,.cycle li.cur::before{background:var(--teal)}
.cycle li.cur span{background:var(--orange);color:#fff;box-shadow:0 0 0 5px var(--orange-soft)}
.cycle li.cur,.cycle li.done{color:var(--navy)}
.cycle.big li{font-size:.95rem;padding-top:52px}
.cycle.big li span{width:42px;height:42px;font-size:1rem}
.cycle.big li::before{top:20px}
.cycle .d{display:block;font-weight:400;font-size:.82rem;color:var(--muted);margin-top:4px;padding:0 4px}
@media(max-width:640px){.cycle.big .d{display:none}}
.feu{border-top:5px solid}
.feu.v{border-color:var(--green)} .feu.o{border-color:var(--orange)} .feu.r{border-color:var(--red)}
.feu ul{padding-left:18px;margin:8px 0 0;color:var(--muted);font-size:.93rem}

/* Detail pages */
.sec{margin-bottom:22px}
.sec h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-ink);margin-bottom:6px}
.sec p,.sec div.txt{margin:0;white-space:normal}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.fiche{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:700px){.fiche{grid-template-columns:1fr}}
.fiche .sec{background:var(--bg);border-radius:12px;padding:14px 16px;margin:0}
.fiche .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:.72rem;margin-right:6px}
.fiche .empty-v{color:var(--muted);font-style:italic}
.comment{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.comment .avatar{width:32px;height:32px;font-size:.75rem}
.comment .who{font-weight:600;font-size:.9rem;color:var(--navy)}
.log-k{font-size:.72rem}
pre.prompt{white-space:pre-wrap;background:oklch(0.97 0.01 255);border:1px solid var(--line);border-radius:12px;padding:16px;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0}
.note{background:var(--teal-soft);border-radius:12px;padding:12px 14px;font-size:.92rem;color:var(--teal-ink)}
.note.warn{background:var(--orange-soft);color:var(--orange-ink)}

/* KPI / charts */
.kpi .v{font-family:var(--serif);font-size:2.2rem;color:var(--navy);line-height:1}
.kpi .l{font-size:.86rem;color:var(--muted);margin-top:6px}
.kpi .s{font-size:.75rem;margin-top:6px}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:.88rem}
.bar-track{height:12px;background:oklch(0.95 0.005 255);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--teal)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.table-wrap{overflow-x:auto}

/* Passport */
.pass{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stamp{text-align:center;padding:12px 6px;border-radius:12px;border:1px dashed var(--line);font-size:.78rem;color:var(--muted)}
.stamp i{font-style:normal;font-size:1.5rem;display:block;filter:grayscale(1);opacity:.4}
.stamp.got{border-style:solid;border-color:var(--teal);background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
.stamp.got i{filter:none;opacity:1}
button.stamp{font:inherit;background:var(--card);cursor:pointer;transition:transform .15s,box-shadow .15s}
button.stamp.got{background:var(--teal-soft)}
button.stamp:hover,button.stamp:focus-visible{transform:translateY(-2px);box-shadow:0 4px 14px oklch(0.3 0.05 255 / .12);outline:none}
button.stamp[aria-pressed=true]{border:2px solid var(--navy-2)}
.stamp-info{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:.85rem;line-height:1.45}
.stamp-info:empty{display:none}
.pass-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.pass-bar span{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .6s}
/* Bandeau d'accueil illustré */
.welcome{position:relative;overflow:hidden;isolation:isolate}
.welcome-bg{position:absolute;inset:-6%;z-index:-2;background:center/cover no-repeat;animation:heroDrift 30s ease-in-out infinite alternate;opacity:.55}
.welcome::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,var(--navy) 0%,oklch(0.3 0.08 255 / .92) 45%,oklch(0.35 0.09 255 / .55) 100%)}
.next-step{display:flex;gap:10px;align-items:center;margin-top:18px;padding:10px 14px;border-radius:12px;background:oklch(1 0 0 / .1);border:1px solid oklch(1 0 0 / .18);font-size:.9rem;color:#fff;flex-wrap:wrap}
@media(max-width:860px){.welcome-g{grid-template-columns:1fr!important}}
.cyc-dark .cycle li{color:oklch(1 0 0 / .7)}.cyc-dark .cycle li.cur,.cyc-dark .cycle li.done{color:#fff}.cyc-dark .cycle li::before{background:oklch(1 0 0 / .25)}
.next-step a{color:oklch(0.88 0.08 190);font-weight:600}
@media (prefers-reduced-motion:reduce){.welcome-bg{animation:none}}

/* Auth */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 66px)}
.auth-art{background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center}
.auth-art h2{color:#fff}
.auth-art .const .lbl{fill:#fff}.auth-art .const .nd-n{fill:#fff}.auth-art .const .nd-c{fill:var(--navy);stroke:#fff}

@keyframes up{from{transform:translateY(10px);opacity:0}}
dialog{border:0;border-radius:var(--radius);padding:0;max-width:640px;width:92vw;box-shadow:0 20px 60px oklch(0.2 0.03 255 / .3)}

footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.86rem}

/* =====================================================================
   V2 — Interface connectée : barre latérale, bandeaux photo, tuiles,
   tableau de bord personnel, parcours, échanges d'équipe
   ===================================================================== */
:root{ --side:264px; --rose:oklch(0.62 0.17 0); --rose-soft:oklch(0.96 0.03 0); --violet:oklch(0.55 0.15 295); --violet-soft:oklch(0.96 0.03 295) }
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Barre latérale */
.side{display:none}
body.shell .side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#fff;z-index:50;padding:18px 14px;overflow-y:auto}

.side-grp{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:oklch(1 0 0 / .45);font-weight:700;margin:18px 10px 6px}
.side a.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:oklch(1 0 0 / .78);text-decoration:none;font-weight:500;font-size:.94rem;position:relative}
.side a.nav:hover{background:oklch(1 0 0 / .07);color:#fff}

.side-user b{display:block;font-size:.9rem}
.side-user span{font-size:.78rem;color:oklch(1 0 0 / .6)}
.side-user button{margin-left:auto;background:none;border:0;color:oklch(1 0 0 / .7);cursor:pointer;padding:8px;border-radius:10px}
.side-user button:hover{background:oklch(1 0 0 / .1);color:#fff}
body.shell .topbar,body.shell main,body.shell footer,body.shell #banner{margin-left:var(--side)}
body.shell .topbar .brand{display:none}
body.shell #nav{display:none}
.crumb{font-weight:600;color:var(--navy);display:flex;align-items:center;gap:10px}
.crumb .ico{color:var(--teal-ink)}
.bar-search{flex:1;max-width:420px;position:relative}
.bar-search input{padding-left:40px;border-radius:999px;background:oklch(0.97 0.005 255);min-height:40px}
.bar-search .ico{position:absolute;left:14px;top:10px;color:var(--muted)}
.scrim{display:none}
@media(max-width:1000px){

  body.shell.side-open .side{transform:none;box-shadow:0 0 60px oklch(0.2 0.03 255 / .4)}

}

.pbanner{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:40px 36px;margin-bottom:28px;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;
  background-color:var(--navy);background-size:cover;background-position:center;isolation:isolate}
.pbanner::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,oklch(0.24 0.07 255 / .92) 0%,oklch(0.28 0.08 255 / .7) 45%,oklch(0.3 0.08 255 / .15) 100%)}

.tile .ico{width:30px;height:30px;stroke-width:1.6}
.tile::after{content:"";position:absolute;right:-24px;bottom:-24px;width:80px;height:80px;border-radius:50%;background:oklch(1 0 0 / .12)}

/* Cartes KPI avec pastille icône */
.kcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}

.k-navy{--kc:var(--navy);--kc-soft:var(--navy-soft)} .k-orange{--kc:var(--orange-ink);--kc-soft:var(--orange-soft)} .k-green{--kc:oklch(0.42 0.11 150);--kc-soft:var(--green-soft)} .k-rose{--kc:var(--rose);--kc-soft:var(--rose-soft)} .k-violet{--kc:var(--violet);--kc-soft:var(--violet-soft)}

/* Titres de section */
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:36px 0 16px}
.sh h2{margin:0;font-size:1.45rem;display:flex;align-items:center;gap:10px}
.sh h2::before{content:"";width:22px;height:5px;border-radius:99px;background:var(--orange)}

/* Cartes avec couverture photo */
.card.cov{padding:0;overflow:hidden}

.card.cov .cv .badges{position:absolute;left:12px;top:4px;margin:8px 0}

.card.cov .cb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card.cov .cb h3{margin:0}
.card.cov .ft{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.card.cov .ft .avatar{width:26px;height:26px;font-size:.66rem}
.card.cov .ft .stat{margin-left:auto;display:flex;gap:10px;align-items:center}
.card.cov .ft .stat .ico{width:15px;height:15px}
.card.item.cov:hover .cv{filter:saturate(1.15)}

/* Parcours IA (non cliquable, 5 niveaux) */
.journey{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.journey::before{content:"";position:absolute;top:21px;left:10%;right:10%;height:4px;border-radius:99px;background:var(--line)}
.journey .jfill{position:absolute;top:21px;left:10%;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--orange));transition:width .8s}
.journey li{min-width:0;overflow-wrap:anywhere;text-align:center;font-size:.76rem;color:var(--muted);position:relative;z-index:1;padding:0 2px}
.journey li i{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 6px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-style:normal;font-size:1.2rem;filter:grayscale(1);opacity:.55}
.journey li.got i{border-color:var(--teal);background:var(--teal-soft);filter:none;opacity:1}
.journey li.now i{border-color:var(--orange);background:var(--orange-soft);box-shadow:0 0 0 5px oklch(0.72 0.15 55 / .18)}
.journey li.got,.journey li.now{color:var(--navy);font-weight:600}
.dark .journey li{color:oklch(1 0 0 / .6)} .dark .journey li.got,.dark .journey li.now{color:#fff}
.dark .journey::before{background:oklch(1 0 0 / .2)}
.dark .journey li i{background:oklch(1 0 0 / .08);border-color:oklch(1 0 0 / .25)}
.dark .journey li.got i{background:oklch(0.63 0.1 190 / .35);border-color:oklch(0.8 0.08 190)}
.dark .journey li.now i{background:oklch(0.72 0.15 55 / .35);border-color:var(--orange)}

.spark div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.spark span{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--teal),var(--teal-ink));min-height:4px}

function constellation(labels=['SPSTI 23/87','SPSTI partenaire','SPSTI partenaire']){
  const C = [[150,150],[410,135],[280,350]], core = [280,225];
  let lines='', nodes='', lbl='', flows='';
  const all = [];
  C.forEach(([cx,cy],k) => {
    const pts = [0,1,2,3,4].map(i => { const a=(i*72-90+k*24)*Math.PI/180; return [cx+Math.cos(a)*54, cy+Math.sin(a)*54]; });
    all.push(pts);
    pts.forEach((p,i) => { const q=pts[(i+1)%5];
      lines += `<line class="ln" x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}"/>`;
      lines += `<line class="ln thin" x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`; });
    const mx=(cx+core[0])/2+(k-1)*34, my=(cy+core[1])/2-18;
    flows += `<path class="flow" style="animation-delay:-${k*2}s" d="M${cx} ${cy}Q${mx} ${my} ${core[0]} ${core[1]}"/>`;
    nodes += pts.map((p,i) => `<circle class="nd ${(i+k)%2?'nd-t':'nd-n'}" style="animation-delay:-${(i*0.9+k*0.5).toFixed(1)}s" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(6+((i+k)%3)*1.6).toFixed(1)}"/>`).join('');
    nodes += `<circle class="nd-c" cx="${cx}" cy="${cy}" r="9"/>`;
    const ty = k===2 ? cy+86 : cy-78, w = labels[k].length*7.2+22;
    lbl += `<rect class="lbl-bg" x="${cx-w/2}" y="${ty-16}" width="${w}" height="26" rx="13"/><text class="lbl" x="${cx}" y="${ty+2}" text-anchor="middle">${esc(labels[k])}</text>`;
  });
  const cross = [[all[0][1],all[1][4]],[all[1][2],all[2][0]],[all[2][3],all[0][2]]].map(([a,b]) => `<line class="x" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`).join('');
  return `<svg class="const" viewBox="40 40 500 420" role="img" aria-label="Réseau vivant : des professionnels de plusieurs SPSTI reliés, l'IA au centre comme outil de connexion">
    ${cross}${lines}${flows}
    <circle class="halo" cx="${core[0]}" cy="${core[1]}" r="40"/>
    <circle class="core" cx="${core[0]}" cy="${core[1]}" r="20"/>
    <text x="${core[0]}" y="${core[1]+5}" text-anchor="middle" style="font:700 14px var(--font);fill:#fff">IA</text>
    ${nodes}${lbl}</svg>`;
}

function demoNormalize(t, r, old){
  if ('visibility' in r) { if (r.visibility!=='reseau') r.network_status='aucun'; else if (!r.network_status || r.network_status==='aucun') r.network_status='en_attente'; }
  if (t==='experiments' && ['validee','partagee'].includes(r.status) && (!r.results || !r.decision)) throw new Error('experiments_validation_documentee');
  if (old && old.status!==r.status && r.org_id) D.audit_log.unshift({id:newId(),org_id:r.org_id,actor_id:S.user.id,action:'statut',target_type:t,target_id:r.id,detail:{de:old.status,vers:r.status},created_at:new Date().toISOString()});
  if (old && old.network_status!==r.network_status && r.org_id) D.audit_log.unshift({id:newId(),org_id:r.org_id,actor_id:S.user.id,action:'partage_reseau',target_type:t,target_id:r.id,detail:{de:old.network_status,vers:r.network_status},created_at:new Date().toISOString()});
}
const CONTENT = ['ideas','experiments','prompts','tools','documents'];
function demoVisible(t, rows){
  const myTeams = () => new Set(D.team_members.filter(m => m.user_id===S.user?.id).map(m => m.team_id));
  if (t==='teams') return rows.filter(x => x.org_id===S.org);
  if (t==='direct_messages') return rows.filter(x => x.org_id===S.org && [x.sender_id,x.recipient_id].includes(S.user?.id));
  if (t==='messages') { const mt = myTeams(); return rows.filter(x => x.org_id===S.org && (!x.team_id || mt.has(x.team_id))); }
  if (!CONTENT.includes(t)) return rows;
  return rows.filter(x => x.org_id===S.org || (x.visibility==='reseau' && x.network_status==='approuve'));
}
const match = (x, m) => Object.entries(m).every(([k,v]) => x[k]===v);

/* ================= Couche d'accès aux données ================= */
const api = {
  async list(t, o={}){
    const { eq={}, order='created_at', asc=false, limit, inF } = o;
    if (S.demo) {
      let r = (D[t]||[]).filter(x => match(x, eq));
      if (inF) r = r.filter(x => inF[1].includes(x[inF[0]]));
      r = demoVisible(t, r);
      if (order) r = [...r].sort((a,b) => ((a[order]??'') > (b[order]??'') ? 1 : -1) * (asc?1:-1));
      if (limit) r = r.slice(0, limit);
      return structuredClone(r);
    }
    let q = sb.from(t).select('*');
    for (const [k,v] of Object.entries(eq)) q = v===null ? q.is(k, null) : q.eq(k, v);
    if (inF) q = q.in(inF[0], inF[1]);
    if (order) q = q.order(order, { ascending:asc });
    if (limit) q = q.limit(limit);
    const { data, error } = await q; if (error) throw error; return data || [];
  },
  async get(t, id){
    if (S.demo) { const x = demoVisible(t, (D[t]||[]).filter(r => r.id===id))[0]; return x ? structuredClone(x) : null; }
    const { data, error } = await sb.from(t).select('*').eq('id', id).maybeSingle(); if (error) throw error; return data;
  },
  async insert(t, row){
    if (S.demo) {
      const r = { ...(DEFAULTS[t]||{}), ...row, id:newId(), created_at:new Date().toISOString(), updated_at:new Date().toISOString(), is_demo:false };
      if (AUTHORED.includes(t)) r.author_id = S.user.id;
      if (['idea_interests','experiment_members','team_members'].includes(t)) r.user_id = r.user_id || S.user.id;
      if (t==='direct_messages') { r.sender_id = S.user.id; r.read_at = null; }
      if (t==='teams') { r.created_by = S.user.id; D.team_members.push({ team_id:r.id, user_id:S.user.id, role:'referent' }); }
      if (t==='team_members') r.role = r.role || 'membre';
      demoNormalize(t, r, null); D[t].push(r); return structuredClone(r);
    }
    const { data, error } = await sb.from(t).insert(row).select().maybeSingle(); if (error) throw error; return data;
  },
  async update(t, m, patch){
    if (S.demo) {
      const x = D[t].find(r => match(r, m)); if (!x) throw new Error('Élément introuvable');
      const old = { ...x }, nx = { ...x, ...patch, updated_at:new Date().toISOString() };
      demoNormalize(t, nx, old); Object.assign(x, nx); return structuredClone(x);
    }
    const { data, error } = await sb.from(t).update(patch).match(m).select();
    if (error) throw error; if (!data || !data.length) throw new Error('Action non autorisée pour votre rôle.'); return data[0];
  },
  async upsert(t, row, keys){
    if (S.demo) { const m = Object.fromEntries(keys.map(k => [k,row[k]])); const x = D[t].find(r => match(r,m)); if (x) Object.assign(x,row); else D[t].push({...row}); return; }
    const { error } = await sb.from(t).upsert(row, { onConflict:keys.join(',') }); if (error) throw error;
  },
  async del(t, m){
    if (S.demo) { D[t] = D[t].filter(x => !match(x, m)); return; }
    const { error } = await sb.from(t).delete().match(m); if (error) throw error;
  },
  async rpc(fn, args){
    if (S.demo) {
      if (fn==='mark_dm_read') { D.direct_messages.forEach(m => { if (m.recipient_id===S.user.id && m.sender_id===args.p_peer && !m.read_at) m.read_at = new Date().toISOString(); }); return null; }
      if (fn==='regenerate_join_code') { const c = Math.random().toString(36).slice(2,12).toUpperCase(); D.org_secrets[0].join_code=c; return c; }
      if (fn==='create_organization') { const id=newId(); D.organizations.push({id,name:args.p_name,short_name:args.p_short}); return id; }
      throw new Error("Non disponible en mode démo.");
    }
    const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data;
  }
};

async function loadContext(){
  if (S.demo) {
    S.user = { id:'u-me', email:'demo@exemple.fr' };
  } else {
    if (!sb) { S.user=null; return; }
    const { data:{ session } } = await sb.auth.getSession();
    S.user = session?.user || null;
  }
  if (!S.user) { Object.assign(S, { profile:null, memberships:[], org:null, role:null, netAdmin:false }); return; }
  const [prof, mems, orgs, na] = await Promise.all([
    api.get('profiles', S.user.id),
    api.list('memberships', { eq:{ user_id:S.user.id }, asc:true }),
    api.list('organizations', { order:'name', asc:true }),
    api.list('network_admins', { order:null })
  ]);
  S.profile = prof || { id:S.user.id, full_name:'', job:null };
  S.memberships = mems;
  S.orgs = Object.fromEntries(orgs.map(o => [o.id,o]));
  S.netAdmin = na.length > 0;
  let saved = null; try { saved = localStorage.getItem('pr-org'); } catch {}
  S.org = (mems.find(m => m.org_id===saved) || mems[0])?.org_id || null;
  S.role = mems.find(m => m.org_id===S.org)?.role || null;
  const ps = await api.list('profiles', { order:null });
  S.profiles = Object.fromEntries(ps.map(p => [p.id,p]));
}

async function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [p='', a, b] = h.split('/');
  const pub = ['', 'connexion', 'decouvrir'];
  if (!pub.includes(p) && !S.user) { location.hash = '#/connexion'; return; }
  if (S.user && !S.org && !['rejoindre','profil','decouvrir'].includes(p)) { location.hash = '#/rejoindre'; return; }
  if (p==='connexion' && S.user) { location.hash = S.org ? '#/' : '#/rejoindre'; return; }
  if (CUR.rt && p!=='echanges') { try { sb.removeChannel(CUR.rt); } catch {} CUR.rt = null; }
  if (S.user && S.org) await refreshUnread();
  renderShell(p);
  const app = $('#app');
  app.innerHTML = '<div class="loading"><span class="dots">Chargement</span></div>';
  let html;
  try {
    const pages = {
      '': () => (S.user && S.org) ? pageHome() : pageLanding(),
      decouvrir: pageLanding, connexion: pageAuth, rejoindre: pageJoin,
      idees: () => a==='nouvelle' ? pageIdeaForm(null) : a ? pageIdea(a) : pageIdeas(),
      'idee-modifier': () => pageIdeaForm(a),
      experiences: () => a==='nouvelle' ? pageExpForm(null, b) : a ? pageExp(a) : pageExps(),
      'experience-modifier': () => pageExpForm(a),
      outils: () => pageToolbox(a || 'prompts'),
      prompt: () => pagePrompt(a), 'prompt-nouveau': () => pagePromptForm(null), 'prompt-modifier': () => pagePromptForm(a),
      'outil-nouveau': () => pageToolForm(null), 'outil-modifier': () => pageToolForm(a),
      echanges: () => pageChat(a || 'general'),
      documents: pageDocs, assistant: pageAssistant,
      communaute: pageCommunity, tableau: pageDashboard, admin: pageAdmin, profil: pageProfile
    };
    html = await (pages[p] || (() => `<div class="wrap page">${empty('Page introuvable.', '<a class="btn btn-ghost" href="#/">Retour à l\'accueil</a>')}</div>`))();
  } catch (e) {
    console.error(e);
    html = `<div class="wrap page"><div class="card">${empty('Impossible de charger cette page : ' + esc(errMsg(e)), '<a class="btn btn-ghost" href="#/">Retour à l\'accueil</a>')}</div></div>`;
  }
  app.innerHTML = html;
  if (CUR.after) { const f = CUR.after; CUR.after = null; f(); }
  window.scrollTo(0,0);
}

/* ================= Hero animé : particules reliées + parallaxe ================= */
function startHeroFx(){
  const hero = document.querySelector('.hero'), cv = hero?.querySelector('.hero-fx');
  if (!cv) return;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
  const COLORS = ['31,58,104', '40,163,160', '56,140,220'];   // marine, turquoise, bleu
  let W = 0, H = 0, pts = [];
  const resize = () => {
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(70, W * H / 16000));
    pts = Array.from({ length:n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
      r: 1.5 + Math.random() * 2.8, c: COLORS[Math.random() * 3 | 0], ph: Math.random() * 6.28
    }));
  };
  resize(); addEventListener('resize', resize);
  const draw = t => {
    if (!cv.isConnected) { removeEventListener('resize', resize); return; }
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      if (!still) { p.x += p.vx; p.y += p.vy; }
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    const fade = p => { const dx = (p.x - W/2) / (W * .3), dy = (p.y - H/2) / (H * .45); return Math.min(1, dx*dx + dy*dy); }; // 0 au centre, 1 sur les côtés
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 140) { ctx.strokeStyle = `rgba(56,140,220,${(1 - d / 140) * .35 * Math.min(fade(a), fade(b))})`; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    for (const p of pts) {
      const glow = .55 + .45 * Math.sin(t / 900 + p.ph), f = fade(p);
      ctx.fillStyle = `rgba(${p.c},${.25 * glow * f})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, 6.28); ctx.fill();
      ctx.fillStyle = `rgba(${p.c},${.9 * f})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  if (!still) hero.addEventListener('mousemove', e => {           // parallaxe douce au survol
    const r = hero.getBoundingClientRect(), bg = hero.querySelector('.hero-bg');
    bg.style.setProperty('--px', ((e.clientX - r.left) / r.width - .5) * -24 + 'px');
    bg.style.setProperty('--py', ((e.clientY - r.top) / r.height - .5) * -16 + 'px');
  });
}

async function ideaStats(){
  const [ints, coms] = await Promise.all([safe(api.list('idea_interests',{order:null})), safe(api.list('idea_comments',{order:null}))]);
  const st = {};
  for (const x of ints) (st[x.idea_id] ??= {likes:0,coms:0,testers:0}).likes++, x.wants_to_test && st[x.idea_id].testers++;
  for (const c of coms) (st[c.idea_id] ??= {likes:0,coms:0,testers:0}).coms++;
  CUR.ideaStats = st; return st;
}

/* Parcours IA : 5 niveaux, simple indicateur de progression (non cliquable) */
function journeyLevels(m){
  return [
    ['🌱','Curieux·se', true],
    ['💡','Contributeur·rice', m.ideas.length>0 || m.prs.length>0 || m.com.length>=3],
    ['🧪','Testeur·se', m.mems.length>0 || m.ints.some(i=>i.wants_to_test)],
    ['📊','Référent·e', m.exps.some(e=>['en_evaluation','validee','partagee'].includes(e.status))],
    ['🌐','Passeur·se', [...m.ideas,...m.prs,...m.exps].some(x=>x.network_status==='approuve')]
  ];
}
function journey(m){
  const L = journeyLevels(m); let n = 0; while (n < L.length && L[n][2]) n++;
  const pct = Math.max(0, n-1) / (L.length-1) * 80;
  return `<ol class="journey" aria-label="Parcours IA : niveau ${n} sur ${L.length}"><span class="jfill" style="width:${pct}%"></span>${L.map(([i,l],k) =>
    `<li class="${k<n-1?'got':k===n-1?'now':''}"><i>${i}</i>${l}</li>`).join('')}</ol>`;
}
function weekly(m){
  const all = [...m.ideas, ...m.com, ...m.prs, ...m.exps, ...m.logs, ...m.msgs].map(x => new Date(x.created_at).getTime());
  const W = 7*864e5, now = Date.now();
  const b = Array.from({length:8}, (_,k) => all.filter(t => t > now-(8-k)*W && t <= now-(7-k)*W).length);
  const max = Math.max(1, ...b);
  return `<div class="spark" role="img" aria-label="Contributions des 8 dernières semaines : ${b.join(', ')}">${b.map((v,k) =>
    `<div title="${v} contribution(s)"><span class="${v?'':'z'}" style="height:${Math.max(4, v/max*100)}%"></span><small>${k===7?'auj.':'S-'+(7-k)}</small></div>`).join('')}</div>`;
}

function msgHtml(m){
  const mine = m.author_id===S.user.id, n = who(m);
  const t = new Date(m.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  return `<div class="msg ${mine?'me':''}" data-mid="${m.id}"><span class="avatar" style="width:32px;height:32px;font-size:.72rem">${esc(initials(n))}</span>
    <div class="bubble"><div class="mh"><b>${esc(mine?'Moi':n)}</b> · ${t}${mine||(isAdmin()&&!m._t)?`<button class="del" data-act="delMsg" data-t="${m._t||'messages'}" data-id="${m.id}" title="Supprimer" aria-label="Supprimer le message">✕</button>`:''}${m._t && mine ? `<span title="${m.read_at?'Lu':'Envoyé'}">${m.read_at?' ✓✓':' ✓'}</span>` : ''}</div>${nl(m.body)}</div></div>`;
}
function threadHtml(msgs){
  let last = '', out = '';
  for (const m of msgs) {
    const d = new Date(m.created_at).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    if (d !== last) { out += `<div class="day">${d}</div>`; last = d; }
    out += msgHtml(m);
  }
  return out || `<div class="empty">${emptyArt()}<p>Aucun message pour l'instant. Lancez la conversation !</p></div>`;
}

        <div class="who-stack">${stack}</div>

      </div>

      ${team && canManage(team) && notIn.length ? `<form data-form="addMember" data-id="${team.id}" style="display:flex;gap:10px;padding:0 16px 16px;flex-wrap:wrap"><select name="user_id" aria-label="Collègue à ajouter" style="flex:1;min-width:200px">${notIn.map(p=>`<option value="${p.id}">${esc(p.full_name||'Membre')} — ${esc(p.job||'')}</option>`).join('')}</select><button class="btn btn-soft sm" type="submit">${ic('plus')} Ajouter à l'équipe</button></form>` : ''}`

      </nav>

/* Temps réel : les nouveaux messages arrivent sans recharger (Supabase Realtime) */
function subscribeChat(){
  if (S.demo || !sb || CUR.rt) return;
  CUR.rt = sb.channel('msgs-' + S.org)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages', filter:'org_id=eq.' + S.org }, ({ new:m }) => {
      const th = $('.thread');
      if (!th || !location.hash.startsWith('#/echanges') || (m.team_id || 'general') !== CUR.chat || th.querySelector(`[data-mid="${m.id}"]`)) return;
      th.querySelector('.empty')?.remove();
      th.insertAdjacentHTML('beforeend', msgHtml(m)); th.scrollTop = th.scrollHeight;
    }).subscribe();
}

const DOC_CATS = ['Procédures & modèles','Réglementation','Supports de prévention','Formation','Organisation interne','Comptes rendus (non nominatifs)'];
const DOC_EXT = { pdf:['PDF','var(--red)'], docx:['DOCX','var(--navy-2)'], doc:['DOC','var(--navy-2)'], odt:['ODT','var(--navy-2)'], xlsx:['XLSX','oklch(0.48 0.12 150)'], xls:['XLS','oklch(0.48 0.12 150)'], ods:['ODS','oklch(0.48 0.12 150)'], csv:['CSV','oklch(0.48 0.12 150)'], pptx:['PPTX','var(--orange-ink)'], ppt:['PPT','var(--orange-ink)'], png:['PNG','var(--violet)'], jpg:['JPG','var(--violet)'], jpeg:['JPG','var(--violet)'], txt:['TXT','var(--muted)'] };
const DOC_ACCEPT = '.' + Object.keys(DOC_EXT).join(',.');
const extOf = n => (String(n).split('.').pop() || '').toLowerCase();
const fmtSize = b => b==null ? '' : b < 1024*1024 ? Math.max(1, Math.round(b/1024)) + ' Ko' : (b/1048576).toFixed(1).replace('.',',') + ' Mo';
const DEMO_FILES = {};   // fichiers déposés pendant la démo (restent dans le navigateur)
function docCard(d){

  const own = d.author_id===S.user.id;
  return `<div class="card item" style="gap:10px">

/* ================= Tableau de bord ================= */
async function pageDashboard(){
  const [ideas, exps, prompts, logs, ints, mems, coms] = await Promise.all([
    api.list('ideas',{eq:{org_id:S.org}}), api.list('experiments',{eq:{org_id:S.org}}), api.list('prompts',{eq:{org_id:S.org}}),
    api.list('experiment_logs'), api.list('idea_interests',{order:null}), api.list('experiment_members',{order:null}), api.list('idea_comments')
  ]);
  const f = F.dash, since = { '30':30, '90':90, '365':365 }[f.period];
  const inP = x => !since || new Date(x.created_at) > Date.now() - since*864e5;
  const I = ideas.filter(i => inP(i) && (!f.job || i.job===f.job));
  const E = exps.filter(inP);
  const eIds = new Set(E.map(e=>e.id)), iIds = new Set(I.map(i=>i.id));
  const L = logs.filter(l => eIds.has(l.experiment_id));
  const participants = new Set([...I.map(i=>i.author_id), ...ints.filter(x=>iIds.has(x.idea_id)).map(x=>x.user_id), ...mems.filter(m=>eIds.has(m.experiment_id)).map(m=>m.user_id), ...L.map(l=>l.author_id), ...coms.filter(c=>iIds.has(c.idea_id)).map(c=>c.author_id)].filter(Boolean));
  const studied = I.filter(i => i.status!=='nouvelle').length;
  const running = E.filter(e => ['selectionnee','en_test'].includes(e.status)).length;
  const evaluated = E.filter(e => ['en_evaluation','validee','partagee'].includes(e.status)).length;
  const documented = E.filter(e => ['validee','partagee'].includes(e.status)).length;
  const shared = [...I, ...E, ...prompts].filter(x => x.network_status==='approuve').length;
  const est = E.reduce((s,e)=>s+(e.time_est_min||0),0), meas = E.filter(e=>e.time_measured_min!=null);
  const measSum = meas.reduce((s,e)=>s+e.time_measured_min,0);
  const sats = E.filter(e=>e.satisfaction); const sat = sats.length ? (sats.reduce((s,e)=>s+e.satisfaction,0)/sats.length).toFixed(1) : '—';
  const risks = L.filter(l=>l.kind==='risque');
  const kpi = (v,l,s='') => `<div class="card kpi"><div class="v">${v}</div><div class="l">${l}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  const maxSt = Math.max(1, ...Object.keys(IDEA_ST).map(k => I.filter(i=>i.status===k).length));
  return `<div class="wrap page">
    ${pbanner('tableau','Tableau de bord · '+esc(orgName(S.org)),'Ce que le pilote produit','Indicateurs collectifs. Ils ne servent jamais à évaluer ou classer une personne.')}
    <div class="page-head" style="justify-content:flex-end"><div class="chips"><select aria-label="Période" data-dash="period"><option value="all">Depuis le début</option><option value="30" ${f.period==='30'?'selected':''}>30 derniers jours</option><option value="90" ${f.period==='90'?'selected':''}>3 derniers mois</option><option value="365" ${f.period==='365'?'selected':''}>12 derniers mois</option></select>
      <select aria-label="Métier" data-dash="job">${jobOpts(f.job,'Tous les métiers')}</select></div></div>
    <div class="grid g4">
      ${kcard('idea','Idées déposées',I.length,'','k-orange')}${kcard('search','Idées étudiées',studied)}${kcard('flask','Tests en cours',running,'','k-navy')}${kcard('chart','Tests évalués',evaluated,'','k-violet')}
      ${kcard('check','Solutions documentées',documented,'Validées pour un usage défini','k-green')}${kcard('globe','Partagés au réseau',shared)}${kcard('users','Participants actifs',participants.size,'Personnes ayant contribué','k-rose')}${kcard('star','Satisfaction / 5',sat,sats.length+' évaluation(s)','k-orange')}
    </div>
    <div class="grid g2" style="margin-top:22px">
      <div class="card"><h3>Entonnoir des idées</h3><div class="bars">${Object.entries(IDEA_ST).map(([k,[l]]) => { const n = I.filter(i=>i.status===k).length; return `<div class="bar-row"><span>${l}</span><div class="bar-track"><div class="bar-fill" style="width:${n/maxSt*100}%;${k==='non_retenue'?'background:var(--line)':k==='partagee'?'background:var(--green)':''}"></div></div><b>${n}</b></div>`; }).join('')}</div></div>
      <div class="card"><h3>⏱ Temps gagné</h3>
        <div class="grid g2"><div class="kpi"><div class="v">${est}</div><div class="l">min / sem. estimées</div><div class="s">${badge('Estimation','b-gray')}</div></div>
        <div class="kpi"><div class="v">${meas.length?measSum:'—'}</div><div class="l">min / sem. mesurées</div><div class="s">${badge(meas.length+' mesure(s)','b-teal')}</div></div></div>
        <p class="small muted" style="margin-top:12px">Somme des gains par utilisateur et par semaine déclarés dans chaque fiche. Une estimation n'est jamais présentée comme une mesure. Méthode documentée dans chaque expérimentation.</p></div>
    </div>
    <div class="grid g2" style="margin-top:22px">
      <div class="card"><h3>Détail par expérimentation</h3><div class="table-wrap"><table><thead><tr><th>Projet</th><th>Statut</th><th>Estimé</th><th>Mesuré</th></tr></thead><tbody>${E.map(e=>`<tr><td><a href="#/experiences/${e.id}">${esc(e.name)}</a></td><td>${badge(EXP_ST[e.status][0],EXP_ST[e.status][1])}</td><td>${e.time_est_min??'—'}</td><td>${e.time_measured_min??'—'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Aucune donnée</td></tr>'}</tbody></table></div></div>
      <div class="card"><h3>⚠️ Risques et limites récurrents</h3>${risks.length ? risks.slice(0,6).map(r=>`<p class="small" style="border-left:3px solid var(--red);padding-left:10px">${esc(r.body)}</p>`).join('') : '<p class="muted">Aucun risque signalé dans les journaux.</p>'}</div>
    </div></div>`;
}

/* ================= Formulaires ================= */
const FORMS = {
  async login(d){ const { error } = await sb.auth.signInWithPassword({ email:d.email, password:d.password }); if (error) throw error; await loadContext(); go(S.org ? '#/' : '#/rejoindre'); },
  async signup(d){
    const { data, error } = await sb.auth.signUp({ email:d.email, password:d.password, options:{ data:{ full_name:d.full_name, job:d.job }, emailRedirectTo: location.href.split('#')[0] } });
    if (error) throw error;
    if (!data.session) { modal(`<h3>📩 Vérifiez votre boîte mail</h3><p>Un lien de confirmation a été envoyé à <b>${esc(d.email)}</b>. Cliquez dessus puis revenez vous connecter.</p><div class="dlg-foot"><button class="btn btn-primary" onclick="document.getElementById('dlg').close()">Compris</button></div>`); CUR.authTab='login'; route(); return; }
    await loadContext(); go('#/rejoindre');
  },
  async join(d){ await api.rpc('join_organization', { p_code:d.code }); await loadContext(); toast('Bienvenue dans le réseau !'); go('#/'); },
  async idea(d, f){
    if (d.data_level==='rouge') throw new Error('Données 🔴 interdites : reformulez sans information de santé ni nominative.');
    const row = clean({ title:d.title, problem:d.problem, job:d.job, frequency:d.frequency, impact:d.impact, solution:d.solution, data_level:d.data_level, visibility:d.visibility });
    if (f.dataset.id) { await api.update('ideas', { id:f.dataset.id }, row); toast('Idée mise à jour'); go('#/idees/'+f.dataset.id); }
    else { const r = await api.insert('ideas', { ...row, org_id:S.org }); toast(row.visibility==='reseau' ? 'Idée publiée — partage réseau en attente de validation' : 'Merci ! Votre idée est publiée 💡'); go('#/idees/'+r.id); }
  },
  async ideaStatus(d, f){ await api.update('ideas', { id:f.dataset.id }, { status:d.status, status_note:d.status_note||null }); toast('Statut mis à jour'); route(); },
  async comment(d, f){ await api.insert(f.dataset.t, { [f.dataset.k]:f.dataset.id, body:d.body.trim() }); toast('Publié'); route(); },
  async exp(d, f){
    if (d.data_level==='rouge') throw new Error('Données 🔴 interdites dans une expérimentation sans cadre formellement autorisé.');
    const row = clean(d);
    for (const k of ['time_est_min','time_measured_min','satisfaction']) if (k in row) row[k] = row[k]==null ? null : Number(row[k]);
    if (f.dataset.id) { delete row.idea_id; await api.update('experiments', { id:f.dataset.id }, row); toast('Fiche enregistrée'); go('#/experiences/'+f.dataset.id); }
    else {
      const r = await api.insert('experiments', { ...row, org_id:S.org });
      try { await api.insert('experiment_members', { experiment_id:r.id, user_id:S.user.id }); } catch {}
      if (row.idea_id && isMod()) { try { await api.update('ideas', { id:row.idea_id }, { status:'en_test' }); } catch {} }
      toast('Expérimentation créée 🧪'); go('#/experiences/'+r.id);
    }
  },
  async expStatus(d, f){ await api.update('experiments', { id:f.dataset.id }, { status:d.status }); toast('Statut mis à jour'); route(); },
  async log(d, f){ await api.insert('experiment_logs', { experiment_id:f.dataset.id, kind:d.kind, body:d.body.trim() }); toast('Ajouté au journal'); route(); },
  async prompt(d, f){
    if (d.data_level==='rouge') throw new Error('Un prompt partagé ne doit contenir aucune donnée 🔴.');
    const row = clean(d);
    if (f.dataset.id) { await api.update('prompts', { id:f.dataset.id }, row); toast('Prompt mis à jour'); go('#/prompt/'+f.dataset.id); }
    else { const r = await api.insert('prompts', { ...row, org_id:S.org }); toast('Prompt partagé ✍️'); go('#/prompt/'+r.id); }
  },
  async tool(d, f){
    const row = clean(d);
    if (f.dataset.id) await api.update('tools', { id:f.dataset.id }, row); else await api.insert('tools', { ...row, org_id:S.org });
    toast('Outil enregistré'); go('#/outils/catalogue');
  },
  async gsearch(d){ F.ideas.q = d.q || ''; F.prompts.q = d.q || ''; go('#/idees'); },
  async newDm(d){ if (d.peer) go('#/echanges/dm-' + d.peer); },
  async doc(d, f){
    if (d.data_level==='rouge') throw new Error('Données 🔴 interdites dans la base documentaire.');
    const file = f.querySelector('input[type=file]').files[0];
    if (!file) throw new Error('Choisissez un fichier.');
    if (file.size > 52428800) throw new Error('Fichier trop volumineux (50 Mo maximum).');
    if (!DOC_EXT[extOf(file.name)]) throw new Error('Format non accepté.');
    const safeName = file.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.-]+/g,'-').slice(-80);
    const path = `${S.org}/${newId()}-${safeName}`;
    if (S.demo) DEMO_FILES[path] = URL.createObjectURL(file);
    else { const { error } = await sb.storage.from('documents').upload(path, file, { contentType:file.type || undefined, upsert:false }); if (error) throw error; }
    try {
      await api.insert('documents', clean({ org_id:S.org, title:d.title, description:d.description, category:d.category, data_level:d.data_level, visibility:d.visibility, storage_path:path, file_name:file.name, mime_type:file.type||null, size_bytes:file.size }));
    } catch (e) { if (!S.demo) await sb.storage.from('documents').remove([path]); throw e; }
    closeModal(); toast(d.visibility==='reseau' ? 'Document déposé — partage réseau en attente de validation' : 'Document déposé 📁'); route();
  },
  async msg(d, f){
    const body = (d.body||'').trim(); if (!body) return;
    const ch = CUR.chat;
    const m = ch.startsWith('dm-') ? dmNorm(await api.insert('direct_messages', { org_id:S.org, recipient_id:ch.slice(3), body }))
      : await api.insert('messages', { org_id:S.org, team_id: ch==='general' ? null : ch, body });
    const th = $('.thread');
    if (th && m && !th.querySelector(`[data-mid="${m.id}"]`)) { th.querySelector('.empty')?.remove(); th.insertAdjacentHTML('beforeend', msgHtml(m)); th.scrollTop = th.scrollHeight; }
    f.reset(); f.querySelector('textarea')?.focus();
  },
  async team(d){ const r = await api.insert('teams', clean({ org_id:S.org, name:d.name, description:d.description, color:d.color||'teal' })); toast('Équipe créée 👥'); go('#/echanges/' + r.id); },
  async addMember(d, f){ await api.insert('team_members', { team_id:f.dataset.id, user_id:d.user_id, role:'membre' }); toast('Collègue ajouté·e à l\'équipe'); route(); },
  async challenge(d){ await api.insert('challenges', clean({ ...d, org_id:S.org })); toast('Défi lancé 🎯'); route(); },
  async profile(d){ await api.update('profiles', { id:S.user.id }, clean(d)); await loadContext(); toast('Profil enregistré'); route(); },
  async newOrg(d){ await api.rpc('create_organization', { p_name:d.name, p_short:d.short }); await loadContext(); toast('SPSTI créé. Basculez dessus depuis votre profil pour obtenir son code.'); route(); },
  async newPassword(d){ const { error } = await sb.auth.updateUser({ password:d.password }); if (error) throw error; closeModal(); toast('Mot de passe modifié'); }
};

/* ================= Actions ================= */
const ACTS = {
  burger(el){
    if (document.body.classList.contains('shell')) { const o = document.body.classList.toggle('side-open'); el.setAttribute('aria-expanded', o); return; }
    const n = $('#nav'); n.classList.toggle('open'); el.setAttribute('aria-expanded', n.classList.contains('open'));
  },
  closeModal(){ closeModal(); },
  docUpload(){ modal(docUploadForm()); },
  docCat(el){ F.docs.cat = el.dataset.v; route(); },
  async docOpen(el){
    const d = CUR.docs.find(x => x.id===el.dataset.id); if (!d) return;
    if (d.is_demo && !DEMO_FILES[d.storage_path]) { toast('Exemple fictif : aucun fichier réel derrière ce document.'); return; }
    if (S.demo) { window.open(DEMO_FILES[d.storage_path], '_blank', 'noopener'); return; }
    const { data, error } = await sb.storage.from('documents').createSignedUrl(d.storage_path, 120, { download:d.file_name });
    if (error) throw error;
    window.open(data.signedUrl, '_blank', 'noopener');
  },
  async docDel(el){
    const d = CUR.docs.find(x => x.id===el.dataset.id); if (!d) return;
    if (!await confirmBox('Supprimer définitivement « ' + d.title + ' » ?','Supprimer')) return;
    if (!S.demo) { const { error } = await sb.storage.from('documents').remove([d.storage_path]); if (error) throw error; }
    await api.del('documents', { id:d.id }); toast('Document supprimé'); route();
  },
  closeSide(){ document.body.classList.remove('side-open'); },
  async joinTeam(el){ await api.insert('team_members', { team_id:el.dataset.id, user_id:S.user.id, role:'membre' }); toast('Bienvenue dans l\'équipe 👋'); route(); },
  async leaveTeam(el){ if (!await confirmBox('Quitter cette équipe ? Vous ne verrez plus ses messages.','Quitter')) return; await api.del('team_members', { team_id:el.dataset.id, user_id:S.user.id }); go('#/echanges/general'); },
  async delTeam(el){ if (!await confirmBox("Supprimer l'équipe et tous ses messages ?",'Supprimer')) return; await api.del('teams', { id:el.dataset.id }); if (S.demo) { D.messages = D.messages.filter(m=>m.team_id!==el.dataset.id); D.team_members = D.team_members.filter(m=>m.team_id!==el.dataset.id); } toast('Équipe supprimée'); go('#/echanges/general'); },
  async delMsg(el){ if (!await confirmBox('Supprimer ce message ?','Supprimer')) return; await api.del(el.dataset.t || 'messages', { id:el.dataset.id }); el.closest('.msg')?.remove(); },
  authTab(el, ev){ ev.preventDefault(); CUR.authTab = el.dataset.t; route(); },
  async forgot(el, ev){
    ev.preventDefault();
    const email = $('#em')?.value;
    if (!email) { toast('Saisissez d\'abord votre e-mail', 'err'); $('#em')?.focus(); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
    if (error) throw error; toast('Si un compte existe, un e-mail de réinitialisation a été envoyé.');
  },
  async startDemo(){ seedDemo(); S.demo = true; S.org = 'org-a'; try{localStorage.setItem('pr-org','org-a');}catch{} await loadContext(); go('#/'); toast('Bienvenue dans la démo : vous êtes administratrice fictive.'); },
  async exitDemo(){ S.demo = false; D = null; await loadContext(); go('#/'); },
  async logout(el, ev){ ev?.preventDefault(); if (S.demo) return ACTS.exitDemo(); await sb.auth.signOut(); await loadContext(); go('#/'); },
  needInspire(){ CUR.inspire = true; },

  challengeIdea(el){ CUR.prefill = { problem:'Défi du moment : ' + el.dataset.q + '\n\nMa proposition : ' }; },
  inspire(el){ const [t,p] = INSPIRE[+el.dataset.k]; const f = document.querySelector('form[data-form=idea]').elements; f.namedItem('title').value = t; f.namedItem('problem').value = p; f.namedItem('problem').focus(); },
  scrollExps(){ document.getElementById('experimentations')?.scrollIntoView({ behavior:'smooth' }); },
  async interest(el){
    const test = el.dataset.test==='1', mine = CUR.myInterest, id = CUR.idea.id;
    if (!test && mine) await api.del('idea_interests', { idea_id:id, user_id:S.user.id });
    else if (test && mine?.wants_to_test) await api.update('idea_interests', { idea_id:id, user_id:S.user.id }, { wants_to_test:false });
    else await api.upsert('idea_interests', { idea_id:id, user_id:S.user.id, wants_to_test:test }, ['idea_id','user_id']);
    route();
  },
  async delComment(el){ if (!await confirmBox('Supprimer ce commentaire ?','Supprimer')) return; await api.del(el.dataset.t, { id:el.dataset.id }); route(); },
  async delItem(el){ if (!await confirmBox('Supprimer définitivement cet élément ?','Supprimer')) return; await api.del(el.dataset.t, { id:el.dataset.id }); toast('Supprimé'); go(el.dataset.back); },
  async netMod(el){ await api.update(el.dataset.t, { id:el.dataset.id }, { network_status:el.dataset.v }); toast(el.dataset.v==='approuve' ? 'Partage réseau validé 🌐' : 'Partage refusé'); route(); },
  async joinExp(el){ await api.insert('experiment_members', { experiment_id:el.dataset.id, user_id:S.user.id }); toast('Vous rejoignez les testeurs 🙋'); route(); },
  async leaveExp(el){ await api.del('experiment_members', { experiment_id:el.dataset.id, user_id:S.user.id }); route(); },
  copyPrompt(el){ const p = (CUR.prompts||[]).find(x=>x.id===el.dataset.id) || CUR.prompt; if (p) copyText(p.content); },
  async verifyPrompt(el){ await api.update('prompts', { id:el.dataset.id }, { verified_at:new Date().toISOString().slice(0,10) }); toast('Date de vérification mise à jour'); route(); },
  toolDetail(el){
    const t = CUR.tools.find(x=>x.id===el.dataset.id); if (!t) return;
    const row = (l,v) => v ? `<div class="sec"><h3>${l}</h3><div class="txt">${nl(v)}</div></div>` : '';
    modal(`<div class="badges">${badge(MATURITY[t.maturity][0],MATURITY[t.maturity][2])}${demoBadge(t)}</div><h2>${esc(t.name)}</h2>
      ${row('Objectif',t.purpose)}${row('Problème résolu',t.problem)}${row('Métier',t.job)}${row('Conditions d\'accès',t.access)}
      <div class="grid g2">${row('🟢 Données autorisées',t.allowed_data)}${row('🔴 Données interdites',t.forbidden_data)}</div>
      ${row('Limites connues',t.limits)}${row('Guide d\'utilisation',t.guide)}${row('Exemple',t.example)}${row('Référent',t.referent)}
      ${t.url && /^https?:\/\//.test(t.url) ? `<p><a href="${esc(t.url)}" target="_blank" rel="noopener">Ouvrir l'outil ↗</a></p>` : ''}
      <div class="dlg-foot">${isMod() && t.org_id===S.org ? `<a class="btn btn-ghost" href="#/outil-modifier/${t.id}" onclick="document.getElementById('dlg').close()">Modifier</a>` : ''}<button class="btn btn-primary" onclick="document.getElementById('dlg').close()">Fermer</button></div>`);
  },
  async toggleChallenge(el){ await api.update('challenges', { id:el.dataset.id }, { active:el.dataset.v==='1' }); route(); },
  copyCode(){ copyText($('#jcode').textContent); },
  async regenCode(){ if (!await confirmBox('Régénérer le code ? L\'ancien ne fonctionnera plus.','Régénérer')) return; await api.rpc('regenerate_join_code', { p_org:S.org }); toast('Nouveau code généré'); route(); },
  async removeMember(el){ if (!await confirmBox('Retirer ce membre de votre SPSTI ?','Retirer')) return; await api.del('memberships', { org_id:S.org, user_id:el.dataset.id }); toast('Membre retiré'); route(); },
  async switchOrg(el){ S.org = el.dataset.id; S.role = S.memberships.find(m=>m.org_id===S.org)?.role; try{localStorage.setItem('pr-org',S.org);}catch{} toast('Espace : ' + orgName(S.org)); go('#/'); },
  async leaveOrg(){ if (!await confirmBox('Quitter ce SPSTI ? Vos contributions restent visibles par ses membres.','Quitter')) return; await api.del('memberships', { org_id:S.org, user_id:S.user.id }); try{localStorage.removeItem('pr-org');}catch{} await loadContext(); go('#/'); }
};

/* ================= Écouteurs globaux ================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) {
    if (e.target.closest('#nav a')) $('#nav')?.classList.remove('open');
    return;
  }
  const fn = ACTS[el.dataset.act]; if (!fn) return;
  try { await fn(el, e); } catch (err) { console.error(err); toast(errMsg(err), 'err'); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try { await FORMS[f.dataset.form](Object.fromEntries(new FormData(f)), f); }
  catch (err) { console.error(err); toast(errMsg(err), 'err'); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.filter; if (!k) return;
  const [g, field] = k.split('.'); F[g][field] = e.target.value;
  ({ ideas:renderIdeaList, exps:renderExpList, prompts:renderPromptList, docs:renderDocList })[g]?.();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.name === 'data_level') {
    const f = t.closest('form'); const red = t.value === 'rouge';
    f.querySelector('.stop')?.classList.toggle('show', red);
    const b = f.querySelector('[type=submit]'); if (b) b.disabled = red;
  }
  if (t.dataset.dash) { F.dash[t.dataset.dash] = t.value; route(); }
  if (t.dataset.roleUser) {
    try { await api.update('memberships', { org_id:S.org, user_id:t.dataset.roleUser }, { role:t.value }); toast('Rôle mis à jour'); }
    catch (err) { toast(errMsg(err), 'err'); route(); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key==='Enter' && !e.shiftKey && !e.isComposing && e.target.matches('.composer textarea')) { e.preventDefault(); e.target.form.requestSubmit(); }
  if (e.key==='Escape') document.body.classList.remove('side-open');
});
window.addEventListener('hashchange', route);

/* ================= Démarrage ================= */
(async function init(){
  if (sb) {
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        modal(`<h3>Choisir un nouveau mot de passe</h3><form data-form="newPassword"><div class="field"><label for="np">Nouveau mot de passe</label><input id="np" type="password" name="password" minlength="8" required autocomplete="new-password"></div><div class="dlg-foot"><button class="btn btn-primary" type="submit">Enregistrer</button></div></form>`);
      }
    });
  }
  try { await loadContext(); } catch (e) { console.error(e); toast(errMsg(e), 'err'); }
  route();
})();
</script>
